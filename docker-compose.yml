version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: novo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Database ─────────────────────────────────
      DATABASE_URL: postgresql://novo:${POSTGRES_PASSWORD:-changeme}@postgres:5432/novo

      # ── Auth ─────────────────────────────────────
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # ── App ──────────────────────────────────────
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      NODE_ENV: production

      # ── Storage ───────────────────────────────────
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}

      # ── Tenant Secrets ────────────────────────────
      PLATFORM_SECRET_KEY: ${PLATFORM_SECRET_KEY}
      TENANT_SECRETS_KEY: ${TENANT_SECRETS_KEY:-}

      # ── WhatsApp ──────────────────────────────────
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}

      # ── Payments ──────────────────────────────────
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}

      # ── Indian Compliance ─────────────────────────
      IRP_API_URL: ${IRP_API_URL:-https://einvoice1.gst.gov.in}
      IRP_USERNAME: ${IRP_USERNAME:-}
      IRP_PASSWORD: ${IRP_PASSWORD:-}
      IRP_GSTIN: ${IRP_GSTIN:-}
      EWB_API_URL: ${EWB_API_URL:-https://ewaybillgst.gov.in}
      EWB_USERNAME: ${EWB_USERNAME:-}
      EWB_PASSWORD: ${EWB_PASSWORD:-}
      EWB_GSTIN: ${EWB_GSTIN:-}

      # ── PDF ────────────────────────────────────────
      GOTENBERG_URL: ${GOTENBERG_URL:-}

      # ── AI ────────────────────────────────────────
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # ── Misc ──────────────────────────────────────
      GOOGLE_SHEETS_API_KEY: ${GOOGLE_SHEETS_API_KEY:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-Novo}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
