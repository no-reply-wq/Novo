version: '3.9'

# Minimal Postgres instance for integration tests.
# Start with: docker-compose -f docker-compose.test.yml up -d
# Stop with:  docker-compose -f docker-compose.test.yml down -v

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"       # 5433 on host so it doesn't clash with a local PG
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data   # in-memory — data not persisted between runs
